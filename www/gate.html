<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NRG / INDEX</title>
<style>
html,body{height:100%;margin:0;background:radial-gradient(900px 500px at 20% -10%,rgba(15,198,194,.18),transparent 60%),radial-gradient(700px 420px at 110% 120%,rgba(15,198,194,.12),transparent 58%),linear-gradient(160deg,#070b12,#0d1420);color:#e8eef7;font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
.card{background:rgba(22,30,44,.85);border:1px solid rgba(255,255,255,.09);border-radius:24px;padding:34px 44px;text-align:center;box-shadow:0 34px 90px -34px rgba(0,0,0,.6);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.brand{font-weight:800;letter-spacing:.2em;font-size:13px;color:#93a4bd;text-transform:uppercase}
.dots{display:inline-flex;gap:6px;margin:18px 0 8px}
.dots i{width:8px;height:8px;border-radius:50%;background:#0fc6c2;opacity:.35;animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.foot{font-size:11px;letter-spacing:.18em;color:#93a4bd;text-transform:uppercase}
</style>
</head>
<body>
<div class="card">
  <div class="brand">NRG / INDEX</div>
  <div class="dots"><i></i><i></i><i></i></div>
  <div class="foot">Защищено · проверка</div>
</div>
<script>
try { document.cookie = 'nrgpass=1; path=/; max-age=604800; secure; samesite=lax'; } catch (e) {}
location.replace(location.pathname + location.search + location.hash);
</script>
</body>
</html>
