name: hotfix

# Временный workflow для операций на сервере SafeLine через тот же SSH-доступ,
# что и деплой. Только workflow_dispatch, никаких автозапусков.
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Скрипт в репозитории'
        required: true
        default: 'deploy/hotfix.sh'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Настройка SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Загрузка скрипта на сервер
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id -p "${{ secrets.SSH_PORT }}" \
            -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cat > /tmp/slext-hotfix.sh && chmod 755 /tmp/slext-hotfix.sh" \
            < "${{ inputs.script }}"

      - name: Выполнение на сервере
        run: |
          set -euo pipefail
          timeout 900 ssh -i ~/.ssh/id -p "${{ secrets.SSH_PORT }}" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "sudo -n bash /tmp/slext-hotfix.sh 2>&1 || bash /tmp/slext-hotfix.sh 2>&1"
