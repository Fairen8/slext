name: branch-guard

# Контроль процесса для защищённых веток:
#   * push в prod — результат PR из main с подтверждением владельца (Approve или его merge);
#   * main — рабочая ветка: прямые пуши разрешены, процесс не контролируется.
# При нарушении (push в prod без PR) — issue + красный статус. Дополняет ruleset prod.
on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: branch-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Проверка процесса
        id: check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          OWNER: Fairen8
        run: bash deploy/check-pr-approval.sh

      - name: Сообщить о нарушении
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          gh issue create \
            --title "Нарушение процесса: push в $BRANCH без одобренного PR" \
            --label bug \
            --body "Ветка: \`$BRANCH\`
          Коммит: \`$SHA\`
          Автор пуша: @$ACTOR

          Изменения попали в защищённую ветку без PR (в prod — без PR из main с одобрением владельца).
          Деплой заблокирован. Порядок работы: ветка → PR → одобрение (main: любой участник;
          prod: владелец) → merge (см. CONTRIBUTING.md)." \
            || echo "issue создать не удалось (проверьте права)"

      - name: Итог
        if: steps.check.outcome == 'failure'
        run: exit 1
