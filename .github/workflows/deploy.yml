name: deploy

on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    name: policy
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Проверка процесса (PR + одобрение владельца)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          OWNER: Fairen8
        run: bash deploy/check-pr-approval.sh

  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Синтаксис
        run: |
          python3 -m py_compile bin/*.py
          node --check www/ext.js
          bash -n install.sh
          bash -n uninstall.sh
          bash -n bin/apply-injection.sh
          bash -n deploy/slext-deploy.sh
          bash -n deploy/install-deploy-access.sh
          bash -n deploy/check-pr-approval.sh

  deploy:
    name: deploy
    needs: [policy, checks]
    if: >
      always() &&
      needs.checks.result == 'success' &&
      (needs.policy.result == 'success' || needs.policy.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Настройка SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id
          chmod 600 ~/.ssh/id
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Выгрузка репозитория на сервер (staging, tar-over-ssh)
        run: |
          tar --exclude=.git -czf - . | \
            ssh -i ~/.ssh/id -p "${{ secrets.SSH_PORT }}" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "rm -rf /tmp/slext-stage && mkdir -p /tmp/slext-stage && tar -xzf - -C /tmp/slext-stage"

      - name: Применение на сервере (идемпотентно, с бэкапом)
        run: |
          ssh -i ~/.ssh/id -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "sudo -n /usr/local/bin/slext-deploy"
